# Configuration for the VHDL language server (VS Code extension "VHDL LS")
standard = "2008"

# "work" is reserved in vhdl_ls; "work." in the code still refers to this library.
[libraries]
defaultlib.files = ["src/*.vhd", "tb/*.vhd"]

# UVVM Utility Library (read-only, no diagnostics); keep the path in step with UVVM_DIR in the Makefile
uvvm_util.files = ["/home/preben/design/libs/UVVM/uvvm_util/src/*.vhd"]
uvvm_util.is_third_party = true

# UVVM Scoreboard (used by tb/nco_tb.vhd); same UVVM checkout as above
bitvis_vip_scoreboard.files = ["/home/preben/design/libs/UVVM/bitvis_vip_scoreboard/src/*.vhd"]
bitvis_vip_scoreboard.is_third_party = true
